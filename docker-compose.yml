services:
  masjid-display:
    build: .
    container_name: jaami-masjid-display
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - masjid_data:/data
      # Read the same credential file as Windows without Compose re-interpolating it.
      - type: bind
        source: ./.env
        target: /run/board.env
        read_only: true
        bind:
          create_host_path: false

volumes:
  masjid_data:
